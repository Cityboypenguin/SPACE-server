# Azure VM 上の本番構成。compose.ec2.yaml と同じ形だが、取得元が ACR で、
# ファイル置き場が S3 ではなく Azure Blob になっている。
#
# app は 127.0.0.1 にだけ公開する。外から受けるのは VM 上の nginx で、
# そこから回す（nginx が WebSocket と SSE の面倒を見ている。
# deploy/azure/nginx.conf を参照）。直接 80 を持たせると、その層が消える。
# ログの上限。既定の json-file は上限が無く、書き出したぶんだけ増え続ける。
# ディスクが埋まると3つのコンテナーが揃って止まるので、必ず入れる。
# 10MB×3世代＝1コンテナー最大30MB。障害調査に必要な直近ぶんは残る。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${ACR_IMAGE}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-space}
      # 同じ compose ネットワークの中だけを通るので TLS は張らない。
      DB_TLS: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      JWT_REFRESH_EXPIRATION_MINUTES: ${JWT_REFRESH_EXPIRATION_MINUTES:-43200}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY}
      ACTIVITY_ARCHIVE_HMAC_KEY: ${ACTIVITY_ARCHIVE_HMAC_KEY}
      OPAQUE_ID_SECRET: ${OPAQUE_ID_SECRET}
      INIT_ADMIN_NAME: ${INIT_ADMIN_NAME:-}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
      # ファイル置き場。STORAGE_PROVIDER で Azure Blob と S3 を切り替える。
      # 使わない側の変数が空でも、起動時の検証は選ばれた側しか見ない。
      #
      # Azure の署名手段は2つあり、どちらか片方で足りる。
      #
      #   1. アプリ登録（既定にしたい方）: AZURE_TENANT_ID / AZURE_CLIENT_ID /
      #      AZURE_CLIENT_SECRET。できることは割り当てたロールの範囲だけで、
      #      ロールを外せば止まり、操作ログにその ID が残る。
      #   2. アカウントキー: AZURE_STORAGE_ACCOUNT_KEY。ストレージアカウント1個の
      #      中では全権（全コンテナー、queue/table/file も含む）で、権限を絞れず、
      #      失効はローテーションのみ、操作ログに誰がやったかが残らない。
      #
      # 両方入れるとアカウントキーが勝つ。移行が済んだらキーの行を空にすること。
      # 空にしないと、絞った ID を用意した意味が無くなる。
      #
      # Azure 上の VM でマネージド ID を使う場合、AZURE_* の資格情報は3つとも
      # 不要（シークレットを持たずに済むので一番安全）。
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
      # 既定値は実在するコンテナー名に合わせてある。別のアカウントへ移すときは
      # 両方とも明示すること（未設定だと private 側は <container>-private になる）。
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-space-avatars}
      AZURE_STORAGE_PRIVATE_CONTAINER_NAME: ${AZURE_STORAGE_PRIVATE_CONTAINER_NAME:-space-activity-archives}
      # 公開オブジェクトの URL に読み取りSASを付けるか。既定は付ける。
      #
      # コンテナーの匿名読み取りはストレージアカウントの allowBlobPublicAccess で
      # 決まり、アカウントキーでは開けられない（コントロールプレーンの設定）。
      # 閉じたまま画像を配るために署名する。コンテナーを本当に公開にした場合、
      # またはクエリ文字列を転送しない CDN を前に置いた場合だけ false にする。
      AZURE_BLOB_PUBLIC_SIGN: ${AZURE_BLOB_PUBLIC_SIGN:-}
      # CDN (Front Door) を前に置いたら、その配信ホストを入れる。
      #   例: https://img.senshu-universe.com
      # 未設定なら Blob の既定ホストを直接配る（CDN 無しの構成でもそのまま動く）。
      # アップロードと署名付きURLは常に Blob の本来のホストを使うので影響しない。
      AZURE_BLOB_PUBLIC_ENDPOINT: ${AZURE_BLOB_PUBLIC_ENDPOINT:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_REGION: ${MINIO_REGION:-ap-northeast-1}
      MINIO_BUCKET_LOOKUP: ${MINIO_BUCKET_LOOKUP:-dns}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      APP_ENV: production
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  mysql:
    image: ${ACR_LOGIN_SERVER}/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-space}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 40s
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: ${ACR_LOGIN_SERVER}/redis:7-alpine
    # 既定では一定間隔のスナップショットしか取らない。失効トークンや
    # ワンタイムパスワードを持っているので、追記ログも有効にして
    # 再起動で消えないようにする。
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

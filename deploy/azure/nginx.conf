# Azure VM 上の nginx。80/443 で受けて、同じ VM の app コンテナ(8080)へ渡す。
#
# このアプリは HTTP のほかに WebSocket と SSE の常時接続を使う。既定のプロキシ
# 設定では、どちらも黙って壊れる（エラーは出ず、ただ届かない）。下の3点が要る。
#
#   1. Upgrade/Connection ヘッダの転送 …… 無いと WebSocket が確立しない
#   2. proxy_buffering off            …… 無いと SSE がバッファに溜まって届かない
#   3. proxy_read_timeout を延ばす     …… 既定の60秒で常時接続が切れる

upstream space_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# WebSocket の Upgrade は「要求されたときだけ」転送する。常に "upgrade" を
# 送ると、普通の HTTP リクエストまで壊れる。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Front Door からの通信かどうかを見分ける。
#
# NSG のサービスタグ AzureFrontDoor.Backend は「Front Door の中継サーバ全体」を
# 指すので、それだけでは他人の Front Door からも届いてしまう。自分の Front Door
# だけに絞るには、Front Door が必ず付ける X-Azure-FDID ヘッダの中身を見る必要が
# ある。NSG（経路の制限）と合わせて2重で守る。
#
# space_expected_fdid には Front Door 作成後に発行される ID を入れる。
#   az afd profile show --profile-name <名前> --resource-group <RG> #      --query frontDoorId -o tsv
#
# 空のままなら検査しない。Front Door を作る前でも、この設定ファイルをそのまま
# 配れるようにするため（中途半端に有効化して全部弾く事故を防ぐ）。
map $http_x_azure_fdid $space_expected_fdid {
    default "";
}

map "$space_expected_fdid:$http_x_azure_fdid" $space_block_request {
    default        1;   # ID を設定済みで、一致しなかった場合は弾く
    "~^:"          0;   # ID 未設定 = 検査しない
    "~^(.+):\1$"   0;   # 一致した
}

server {
    listen 80;
    server_name _;

    # Front Door を迂回した直接アクセスを拒否する。AWS では EC2 の 80番が全世界に
    # 開いており、CloudFront を通らずに API を平文で叩けてしまっている。同じ形を
    # 再現しないためのもの。
    if ($space_block_request) {
        return 403;
    }

    # 画像や添付の上限。アプリ側が 21MB を上限にしているので、それに合わせる。
    client_max_body_size 25M;

    # SSE（通知の配信）。ここだけはバッファを完全に切る。
    location /events {
        proxy_pass http://space_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        # 以下が無いと通知が届かない。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # GraphQL。通常のリクエストと WebSocket サブスクリプションの両方が来る。
    location /query {
        proxy_pass http://space_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket サブスクリプション用。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        proxy_pass http://space_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_read_timeout 300s;
    }
}

# Azure VM 上の nginx。80/443 で受けて、同じ VM の app コンテナ(8080)へ渡す。
#
# このアプリは HTTP のほかに WebSocket と SSE の常時接続を使う。既定のプロキシ
# 設定では、どちらも黙って壊れる（エラーは出ず、ただ届かない）。下の3点が要る。
#
#   1. Upgrade/Connection ヘッダの転送 …… 無いと WebSocket が確立しない
#   2. proxy_buffering off            …… 無いと SSE がバッファに溜まって届かない
#   3. proxy_read_timeout を延ばす     …… 既定の60秒で常時接続が切れる

upstream space_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# WebSocket の Upgrade は「要求されたときだけ」転送する。常に "upgrade" を
# 送ると、普通の HTTP リクエストまで壊れる。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 画像や添付の上限。アプリ側が 21MB を上限にしているので、それに合わせる。
    client_max_body_size 25M;

    # SSE（通知の配信）。ここだけはバッファを完全に切る。
    location /events {
        proxy_pass http://space_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        # 以下が無いと通知が届かない。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # GraphQL。通常のリクエストと WebSocket サブスクリプションの両方が来る。
    location /query {
        proxy_pass http://space_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket サブスクリプション用。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        proxy_pass http://space_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_read_timeout 300s;
    }
}

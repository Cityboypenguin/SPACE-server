# Azure VM: 2026-10-30 に実機の certbot 設定と照合。80番はテスト用。
upstream space_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# WebSocket の Upgrade は「要求されたときだけ」転送する。常に "upgrade" を
# 送ると、普通の HTTP リクエストまで壊れる。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.senshu-universe.com;


    # 画像や添付の上限。アプリ側が 21MB を上限にしているので、それに合わせる。
    client_max_body_size 25M;

    # SSE（通知の配信）。ここだけはバッファを完全に切る。
    location /events {
        proxy_pass http://space_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        # 以下が無いと通知が届かない。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # GraphQL。通常のリクエストと WebSocket サブスクリプションの両方が来る。
    location /query {
        proxy_pass http://space_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket サブスクリプション用。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        proxy_pass http://space_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_read_timeout 300s;
    }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.senshu-universe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.senshu-universe.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

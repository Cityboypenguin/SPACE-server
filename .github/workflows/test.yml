name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.6"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (unit, no DB required)
        run: go test -race ./...

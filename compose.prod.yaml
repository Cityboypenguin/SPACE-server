services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-space}
      DB_TLS: ${DB_TLS:-false}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6380}
      REDIS_TLS: ${REDIS_TLS:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      JWT_REFRESH_EXPIRATION_MINUTES: ${JWT_REFRESH_EXPIRATION_MINUTES:-20160}
      INIT_ADMIN_NAME: ${INIT_ADMIN_NAME:-}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
      MINIO_ENDPOINT: s3.${AWS_REGION:-ap-northeast-1}.amazonaws.com
      MINIO_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      MINIO_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-space-storage}
      MINIO_USE_SSL: "true"
      MINIO_REGION: ${AWS_REGION:-ap-northeast-1}
      MINIO_BUCKET_LOOKUP: dns
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
    restart: unless-stopped
